name: Quality

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref_name }}

on:
  pull_request:
    branches: [main]
    paths:
    - .github/workflows/quality.yml
    - '**.rs'
    - Cargo.toml

jobs:
  commit:
    name: Commit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install commitlint
      run: npm install --global @commitlint/{cli,config-conventional}

    - name: Lint
      run: commitlint --from=HEAD~1

  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres
        env:
          POSTGRES_DB: mockable
          POSTGRES_PASSWORD: mockable
          POSTGRES_USER: mockable
        ports:
        - 5432:5432
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Rust
      id: rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: clippy,rustfmt

    - name: Restore cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ steps.rust.outputs.rustc_hash }}-${{ hashFiles('Cargo.toml') }}

    - name: Check format
      uses: actions-rs/cargo@v1
      with:
        args: --check
        command: fmt

    - name: Lint
      uses: actions-rs/cargo@v1
      with:
        args: --all-features --tests -- -D warnings
        command: clippy

    - name: Initialize database
      env:
        PGPASSWORD: mockable
      run: psql -h 127.0.0.1 -U mockable -d mockable -f ./docker-compose/db/init.sql

    - name: Test
      uses: actions-rs/cargo@v1
      with:
        args: --all-features
        command: test

    - name: Test examples
      uses: actions-rs/cargo@v1
      with:
        args: --all-features --examples
        command: test

  native-environment:
    name: Native environment (${{ matrix.os }}, Rust 1.88)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Rust 1.88
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.88.0
        profile: minimal
        override: true

    - name: Check without optional features
      run: cargo +1.88.0 check --no-default-features

    - name: Check mock adapter
      run: cargo +1.88.0 check --no-default-features --features mock

    - name: Test native environment
      run: cargo +1.88.0 test --no-default-features --features mock --test native_env

    - name: Test native environment example
      run: cargo +1.88.0 test --no-default-features --features mock --example native_env
